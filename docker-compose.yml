# Локальная инфраструктура: PostgreSQL, Redis, MinIO (S3), Mailpit (SMTP + веб-почта).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: auction
      POSTGRES_PASSWORD: auction
      POSTGRES_DB: auction
    # 5433 снаружи — чтобы не конфликтовать с локально установленным PostgreSQL.
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auction"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes: [redisdata:/data]

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  # Создаёт бакет с публичным чтением (фото лотов раздаются напрямую, в облаке — через CDN).
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/auction &&
      mc anonymous set download local/auction
      "

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
  redisdata:
  miniodata:
